<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Audio TTS 테스트</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body>

    <h2>Fish Audio TTS API 테스트</h2>

    <div class="form-group">
        <label for="voiceSelect">음성 선택</label>

        <select id="voiceSelect">
            <option value="91ca05cf1d0f41f5876b3cd4bbab7a46">
                고유 ID 1번
            </option>

            <option value="103cf414ca6440f9af735ac36aa9eab5">
                고유 ID 2번
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="textInput">변환할 텍스트</label>

        <textarea
            id="textInput"
            placeholder="여기에 텍스트를 입력하세요."
        >[excited] Hello! Welcome to Fish Audio. [laughing] This is my first AI-generated voice.</textarea>
    </div>

    <button id="playBtn">
        음성 생성 및 재생
    </button>

    <div id="status"></div>

    <script>
        const playBtn = document.getElementById("playBtn");
        const statusDiv = document.getElementById("status");

        playBtn.addEventListener("click", generateAndPlayAudio);

        async function generateAndPlayAudio() {

            const textInput =
                document.getElementById("textInput").value.trim();

            const voiceSelect =
                document.getElementById("voiceSelect").value;

            if (!textInput) {
                alert("텍스트를 입력해주세요.");
                return;
            }

            playBtn.disabled = true;
            statusDiv.innerText = "오디오 생성 중...";

            try {

                const response = await fetch("/api/tts", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: textInput,
                        reference_id: voiceSelect
                    })
                });

                if (!response.ok) {

                    let message = `서버 오류: ${response.status}`;

                    try {
                        const errorData = await response.json();

                        if (errorData.error) {
                            message = errorData.error;
                        }

                    } catch (_) {}

                    throw new Error(message);
                }

                statusDiv.innerText = "음성 데이터 수신 중...";

                const arrayBuffer =
                    await response.arrayBuffer();

                const blob =
                    new Blob([arrayBuffer], {
                        type: "audio/mpeg"
                    });

                const audioUrl =
                    URL.createObjectURL(blob);

                const audio =
                    new Audio(audioUrl);

                audio.onplay = () => {
                    statusDiv.innerText = "재생 중!";
                };

                audio.onended = () => {
                    statusDiv.innerText = "재생 완료";

                    URL.revokeObjectURL(audioUrl);
                };

                audio.onerror = () => {
                    statusDiv.innerText = "오디오 재생에 실패했습니다.";

                    URL.revokeObjectURL(audioUrl);
                };

                await audio.play();

            } catch (error) {

                console.error(error);

                statusDiv.innerText =
                    `실패: ${error.message}`;

            } finally {

                playBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
