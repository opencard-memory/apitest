<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Audio TTS 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Fish Audio TTS API 테스트</h2>

    <div class="form-group">
        <label for="voiceSelect">음성 선택</label>
        <select id="voiceSelect">
            <option value="91ca05cf1d0f41f5876b3cd4bbab7a46">고유 ID 1번 (91ca05...)</option>
            <option value="103cf414ca6440f9af735ac36aa9eab5">고유 ID 2번 (103cf4...)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="textInput">변환할 텍스트</label>
        <textarea id="textInput" placeholder="여기에 목소리로 바꿀 텍스트를 입력하세요.">[excited] Hello! Welcome to Fish Audio. [laughing] This is my first AI-generated voice.</textarea>
    </div>

    <button id="playBtn" onclick="generateAndPlayAudio()">음성 생성 및 재생</button>

    <div id="status"></div>

    <script>
        // 제공해주신 API Key
        const FISH_API_KEY = "sk-fish-MmC2Xs1GhCB6r0SO5B_Fg_qpIOFXQjQFUrFnCpGBg5c";

        async function generateAndPlayAudio() {
            const textInput = document.getElementById("textInput").value;
            const voiceSelect = document.getElementById("voiceSelect").value;
            const playBtn = document.getElementById("playBtn");
            const statusDiv = document.getElementById("status");

            if (!textInput.trim()) {
                alert("텍스트를 입력해주세요.");
                return;
            }

            // UI 상태 업데이트 (로딩 중)
            playBtn.disabled = true;
            statusDiv.innerText = "오디오 생성 중... 잠시만 기다려주세요.";

            try {
                const response = await fetch("https://api.fish.audio/v1/tts", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${FISH_API_KEY}`,
                        "Content-Type": "application/json",
                        "model": "s2.1-pro-free",
                    },
                    body: JSON.stringify({
                        text: textInput,
                        reference_id: voiceSelect,
                        format: "mp3",
                    }),
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status} ${response.statusText}`);
                }

                statusDiv.innerText = "받아온 음성 데이터 재생 준비 중...";

                // ArrayBuffer로 오디오 데이터 읽기
                const arrayBuffer = await response.arrayBuffer();
                
                // Blob 객체 생성 후 재생 가능한 Object URL로 변환
                const blob = new Blob([arrayBuffer], { type: "audio/mp3" });
                const audioUrl = URL.createObjectURL(blob);
                
                // Audio 객체를 생성하여 즉시 재생
                const audio = new Audio(audioUrl);
                audio.play();

                statusDiv.innerText = "재생 중!";
                
                // 재생이 끝나면 상태 텍스트 초기화
                audio.onended = () => {
                    statusDiv.innerText = "재생 완료";
                };

            } catch (error) {
                console.error("에러 발생:", error);
                statusDiv.innerText = `실패: ${error.message}`;
            } finally {
                // 버튼 복구
                playBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
